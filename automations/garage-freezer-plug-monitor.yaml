###############################################################
# Garage Freezer Plug Offline Monitor
#
# Hardware:
#   - Zooz ZEN14 Power Switch, plugged into the garage GFCI circuit
#   - sensor.garage_outdoor_double_plug_node_status (Z-Wave node status:
#     alive / dead / asleep / awake)
#
# Context:
#   The garage GFCI has been tripping intermittently, killing power to
#   the freezer on that circuit. Suspected cause: sprinkler spray reaching
#   a nearby exterior outlet. This is a stopgap alert so a trip gets
#   noticed and the GFCI reset before food spoils, while the underlying
#   fault is investigated.
#
# Why the ping watchdog exists:
#   The ZEN14 is mains powered and has no power metering, so it never
#   reports on its own while idle. Z-Wave JS only marks a node dead after
#   a message TO it fails, so when the GFCI cuts power the node status
#   stays "alive" indefinitely. Automation 0 pings the plug every 30
#   seconds so a power loss flips the node to dead within ~30s.
#   After the node goes dead, pings continue every 30 seconds for 3
#   minutes so a single dropped ping recovers quickly, then back off to
#   every 2 minutes to avoid flooding the mesh with route discovery for
#   an unreachable node.
#   Requires button.garage_outdoor_double_plug_ping to be enabled
#   (device page > entities; Z-Wave JS may ship it disabled).
#
# Logic:
#   - When the node goes dead/unavailable, snapshot the irrigation zone
#     immediately, then wait up to 2 minutes (~4 consecutive failed pings)
#     for recovery. A brief mesh blip recovers silently.
#   - Still down after 2 minutes: alert, then re-notify every 15 minutes.
#     The run ends the moment the plug recovers, so the next outage always
#     starts a fresh run with its own snapshot.
#   - Send an all-clear when the plug reports alive again after an outage
#     long enough to have alerted
#   - On HA startup, wait 2 minutes for Z-Wave JS to reconnect, then
#     restart the offline alert if the plug is still down (a restart
#     otherwise silently ends the 15-minute reminders)
#
# Irrigation correlation:
#   Each alert reports the zone as of the moment the node went dead, not
#   when the alert is sent: whichever zone was running, or otherwise
#   whichever most recently finished. Uses
#   binary_sensor.s01/02/03/04/06/07/08_station_running, which reflect the
#   controller's real state whether a zone was started by the schedule or
#   manually from the OpenSprinkler app. If HA restarted during the
#   outage the snapshot is lost and the alert says the zone is unknown.
#   "Finished X min earlier" is measured from last_changed, which resets
#   on HA restart, so it can understate if HA restarted shortly before a
#   trip. See open-sprinkler.yaml, which runs zones with a 2-minute gap
#   between them so a trip during a gap is a useful signal on its own.
###############################################################

# ----------------------------------------------------------
# AUTOMATION 0: Garage Freezer Plug Ping Watchdog
# ----------------------------------------------------------
- id: garage_freezer_plug_ping
  alias: "Safety - Garage Freezer Plug Ping Watchdog"
  description: >
    Pings the ZEN14 every 30 seconds so Z-Wave JS notices when it loses
    power. Keeps pinging every 30 seconds for the first 3 minutes after
    the node goes dead, then backs off to every 2 minutes.

  trigger:
    - platform: time_pattern
      seconds: "/30"

  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: sensor.garage_outdoor_double_plug_node_status
          state: "alive"
        # Recently went dead: keep retrying fast so a dropped ping recovers
        - condition: template
          value_template: >
            {{ (now() - states.sensor.garage_outdoor_double_plug_node_status.last_changed).total_seconds() < 180 }}
        # Dead longer than that: only ping on even minutes, first slot
        - condition: template
          value_template: "{{ now().minute % 2 == 0 and now().second < 30 }}"

  action:
    - service: button.press
      target:
        entity_id: button.garage_outdoor_double_plug_ping
      continue_on_error: true

  mode: single
  max_exceeded: silent

# ----------------------------------------------------------
# AUTOMATION 1: Garage Freezer Plug Offline
# ----------------------------------------------------------
- id: garage_freezer_plug_offline
  alias: "Safety - Garage Freezer Plug Offline"
  description: >
    Alerts when the garage freezer's Zooz ZEN14 has been offline for 2
    minutes (likely the GFCI tripped), including the irrigation zone at
    the moment it went offline. Repeats every 15 minutes until power is
    restored.

  trigger:
    - platform: state
      entity_id: sensor.garage_outdoor_double_plug_node_status
      to:
        - "dead"
        - "unavailable"
      # Flipping between dead and unavailable is the same outage
      not_from:
        - "dead"
        - "unavailable"

  action:
    - variables:
        tripped_at: "{{ now().strftime('%-I:%M %p') }}"

    - variables:
        # Captured before the confirmation wait so it reflects the trip,
        # not the zone running when the alert finally goes out.
        zone_at_trip: >
          {% if trigger.platform != 'state' %}
            Irrigation at trip: unknown (HA restarted during the outage).
          {% else %}
            {% set stations = {
              'binary_sensor.s01_station_running': 'Zone 1',
              'binary_sensor.s02_station_running': 'Zone 2',
              'binary_sensor.s03_station_running': 'Zone 3',
              'binary_sensor.s04_station_running': 'Zone 4',
              'binary_sensor.s06_station_running': 'Zone 6',
              'binary_sensor.s07_station_running': 'Zone 7',
              'binary_sensor.s08_station_running': 'Zone 8'
            } %}
            {% set ns = namespace(active=none, active_min=none, last_off=none, last_off_min=none) %}
            {% for eid, name in stations.items() %}
              {% set mins = ((now() - states[eid].last_changed).total_seconds() / 60) | round(1) if states[eid] else none %}
              {% if states(eid) == 'on' and mins is not none %}
                {% if ns.active is none or mins < ns.active_min %}
                  {% set ns.active = name %}
                  {% set ns.active_min = mins %}
                {% endif %}
              {% elif states(eid) == 'off' and mins is not none %}
                {% if ns.last_off is none or mins < ns.last_off_min %}
                  {% set ns.last_off = name %}
                  {% set ns.last_off_min = mins %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% if ns.active is not none %}
              Irrigation at trip ({{ tripped_at }}): {{ ns.active }} was running (started {{ ns.active_min }} min earlier).
            {% elif ns.last_off is not none %}
              Irrigation at trip ({{ tripped_at }}): no zone running — {{ ns.last_off }} finished {{ ns.last_off_min }} min earlier.
            {% else %}
              Irrigation at trip ({{ tripped_at }}): no zone activity recorded.
            {% endif %}
          {% endif %}

    # Confirm it's a real outage: ~4 consecutive failed 30-second pings.
    - wait_template: >
        {{ states('sensor.garage_outdoor_double_plug_node_status') not in ['dead', 'unavailable'] }}
      timeout: "00:02:00"
      continue_on_timeout: true

    - condition: template
      value_template: "{{ not wait.completed }}"

    - repeat:
        while:
          - condition: template
            value_template: >
              {{ states('sensor.garage_outdoor_double_plug_node_status') in ['dead', 'unavailable'] }}
        sequence:
          - service: notify.mobile_app_pixel_8_pro
            data:
              title: "🔌⚠️ Garage Freezer Plug Offline"
              message: >
                The garage outdoor double plug (freezer circuit) is offline
                ({{ states('sensor.garage_outdoor_double_plug_node_status') }})
                — the GFCI likely tripped. Reset it now to avoid losing food
                in the freezer.

                {{ zone_at_trip | trim }}
              data:
                channel: "Emergency Alerts"
                importance: high
                ttl: 0
                priority: high
                color: red
                persistent: true

          # Ends early on recovery so this run exits right away instead of
          # sleeping through (and swallowing) a follow-up outage.
          - wait_template: >
              {{ states('sensor.garage_outdoor_double_plug_node_status') not in ['dead', 'unavailable'] }}
            timeout: "00:15:00"
            continue_on_timeout: true

  # Automation 3 may also start this on HA startup; a second run while one
  # is already going is dropped rather than doubling alerts.
  mode: single
  max_exceeded: silent

# ----------------------------------------------------------
# AUTOMATION 2: Garage Freezer Plug Back Online
# ----------------------------------------------------------
- id: garage_freezer_plug_online
  alias: "Safety - Garage Freezer Plug Back Online"
  description: >
    Confirms when the garage freezer's Zooz ZEN14 comes back online after
    an outage long enough to have triggered the offline alert.

  trigger:
    - platform: state
      entity_id: sensor.garage_outdoor_double_plug_node_status
      from:
        - "dead"
        - "unavailable"
      to: "alive"

  # Matches Automation 1's 2-minute confirmation wait, so blips that never
  # alerted don't send an all-clear either.
  condition:
    - condition: template
      value_template: >
        {{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 120 }}

  action:
    - service: notify.mobile_app_pixel_8_pro
      data:
        title: "✅🔌 Garage Freezer Plug Back Online"
        message: >
          The garage outdoor double plug is back online — GFCI reset
          appears to have worked. Verify the freezer is running and cold.
        data:
          channel: "Emergency Alerts"
          importance: normal
          ttl: 0
          priority: normal
          color: green

  mode: single

# ----------------------------------------------------------
# AUTOMATION 3: Garage Freezer Plug Startup Check
# ----------------------------------------------------------
- id: garage_freezer_plug_startup_check
  alias: "Safety - Garage Freezer Plug Startup Check"
  description: >
    A restart kills Automation 1's run, and its state trigger won't
    re-fire if the plug is already offline when HA comes back. After
    startup, restart the offline alert if the plug is still down.

  trigger:
    - platform: homeassistant
      event: start

  action:
    # Z-Wave JS entities read "unavailable" for a while after every
    # restart; give the integration time to reconnect to avoid a false alarm.
    - delay:
        minutes: 2

    - condition: template
      value_template: >
        {{ states('sensor.garage_outdoor_double_plug_node_status') in ['dead', 'unavailable'] }}

    - service: automation.trigger
      target:
        entity_id: automation.safety_garage_freezer_plug_offline
      data:
        skip_condition: true

  mode: single
