###############################################################
# Garage Freezer Plug Offline Monitor
#
# Hardware:
#   - Zooz ZEN14 Power Switch, plugged into the garage GFCI circuit
#   - sensor.garage_outdoor_double_plug_node_status (Z-Wave node status:
#     alive / dead / asleep / awake)
#
# Context:
#   The garage GFCI has been tripping intermittently, killing power to
#   the freezer on that circuit. Suspected cause: sprinkler spray reaching
#   a nearby exterior outlet. This is a stopgap alert so a trip gets
#   noticed and the GFCI reset before food spoils, while the underlying
#   fault is investigated.
#
# Why the ping watchdog exists:
#   The ZEN14 is mains powered and has no power metering, so it never
#   reports on its own while idle. Z-Wave JS only marks a node dead after
#   a message TO it fails, so when the GFCI cuts power the node status
#   stays "alive" indefinitely. Automation 0 pings the plug every 30
#   seconds so a power loss flips the node to dead within ~30s.
#   While the node is dead, pings drop to every 2 minutes to avoid
#   flooding the mesh with route discovery for an unreachable node.
#   Requires button.garage_outdoor_double_plug_ping to be enabled
#   (device page > entities; Z-Wave JS may ship it disabled).
#
# Logic:
#   - Alert when the plug's node status goes dead/unavailable (held for
#     1 minute, i.e. at least two consecutive failed pings, to avoid
#     flagging a brief mesh blip)
#   - Re-notify every 15 minutes while still offline, so a missed alert
#     doesn't turn into a ruined freezer
#   - Send an all-clear when the plug reports alive again
#   - On HA startup, wait 2 minutes for Z-Wave JS to reconnect, then
#     restart the offline alert if the plug is still down (a restart
#     otherwise silently ends the 15-minute reminders)
#
# Irrigation correlation:
#   Each offline alert reports the single most relevant OpenSprinkler zone
#   (switch.s01/02/03/04/06/07/08_station_enabled) — whichever is currently
#   running, or otherwise whichever most recently finished — plus how long
#   ago it started/ended. These switches reflect the controller's real
#   state whether a zone was started by the schedule or run manually from
#   the OpenSprinkler app, so manual runs are covered too. See
#   open-sprinkler.yaml, which now runs zones with a 2-minute gap between
#   them so a trip during a gap (vs. right as a zone starts) is a useful
#   signal on its own.
###############################################################

# ----------------------------------------------------------
# AUTOMATION 0: Garage Freezer Plug Ping Watchdog
# ----------------------------------------------------------
- id: garage_freezer_plug_ping
  alias: "Safety - Garage Freezer Plug Ping Watchdog"
  description: >
    Pings the ZEN14 every 30 seconds so Z-Wave JS notices when it loses
    power. Backs off to every 2 minutes while the node is dead.

  trigger:
    - platform: time_pattern
      seconds: "/30"

  condition:
    - condition: or
      conditions:
        - condition: state
          entity_id: sensor.garage_outdoor_double_plug_node_status
          state: "alive"
        # Node is dead/unavailable: only ping on even minutes, first slot
        - condition: template
          value_template: "{{ now().minute % 2 == 0 and now().second < 30 }}"

  action:
    - service: button.press
      target:
        entity_id: button.garage_outdoor_double_plug_ping
      continue_on_error: true

  mode: single
  max_exceeded: silent

# ----------------------------------------------------------
# AUTOMATION 1: Garage Freezer Plug Offline
# ----------------------------------------------------------
- id: garage_freezer_plug_offline
  alias: "Safety - Garage Freezer Plug Offline"
  description: >
    Alerts when the garage freezer's Zooz ZEN14 goes offline (likely the
    GFCI tripped), and repeats every 15 minutes until power is restored.

  trigger:
    - platform: state
      entity_id: sensor.garage_outdoor_double_plug_node_status
      to:
        - "dead"
        - "unavailable"
      for:
        minutes: 1

  action:
    - repeat:
        while:
          - condition: template
            value_template: >
              {{ states('sensor.garage_outdoor_double_plug_node_status') in ['dead', 'unavailable'] }}
        sequence:
          - variables:
              # Reports exactly one zone: whichever is running right now,
              # or otherwise whichever finished most recently. Avoids
              # sweeping in an entire cycle's worth of prior zones.
              zone_status: >
                {% set stations = {
                  'switch.s01_station_enabled': 'Zone 1',
                  'switch.s02_station_enabled': 'Zone 2',
                  'switch.s03_station_enabled': 'Zone 3',
                  'switch.s04_station_enabled': 'Zone 4',
                  'switch.s06_station_enabled': 'Zone 6',
                  'switch.s07_station_enabled': 'Zone 7',
                  'switch.s08_station_enabled': 'Zone 8'
                } %}
                {% set ns = namespace(active=none, active_min=none, last_off=none, last_off_min=none) %}
                {% for eid, name in stations.items() %}
                  {% set mins = ((now() - states[eid].last_changed).total_seconds() / 60) | round(1) if states[eid] else none %}
                  {% if states(eid) == 'on' and mins is not none %}
                    {% if ns.active is none or mins < ns.active_min %}
                      {% set ns.active = name %}
                      {% set ns.active_min = mins %}
                    {% endif %}
                  {% elif states(eid) == 'off' and mins is not none %}
                    {% if ns.last_off is none or mins < ns.last_off_min %}
                      {% set ns.last_off = name %}
                      {% set ns.last_off_min = mins %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {% if ns.active is not none %}
                  Irrigation: {{ ns.active }} is currently running (started {{ ns.active_min }} min ago).
                {% elif ns.last_off is not none %}
                  Irrigation: no zone running — {{ ns.last_off }} finished most recently ({{ ns.last_off_min }} min ago).
                {% else %}
                  Irrigation: no zone activity detected.
                {% endif %}

          - service: notify.mobile_app_pixel_8_pro
            data:
              title: "🔌⚠️ Garage Freezer Plug Offline"
              message: >
                The garage outdoor double plug (freezer circuit) is offline
                ({{ states('sensor.garage_outdoor_double_plug_node_status') }})
                — the GFCI likely tripped. Reset it now to avoid losing food
                in the freezer.

                {{ zone_status }}
              data:
                channel: "Emergency Alerts"
                importance: high
                ttl: 0
                priority: high
                color: red
                persistent: true

          - delay:
              minutes: 15

  # Automation 3 may also start this on HA startup; a second run while the
  # reminder loop is already going is dropped rather than doubling alerts.
  mode: single
  max_exceeded: silent

# ----------------------------------------------------------
# AUTOMATION 2: Garage Freezer Plug Back Online
# ----------------------------------------------------------
- id: garage_freezer_plug_online
  alias: "Safety - Garage Freezer Plug Back Online"
  description: >
    Confirms when the garage freezer's Zooz ZEN14 comes back online after
    a GFCI reset, and stops the repeating offline alert.

  trigger:
    - platform: state
      entity_id: sensor.garage_outdoor_double_plug_node_status
      from:
        - "dead"
        - "unavailable"
      to: "alive"

  # Only announce recovery if it was offline long enough for the offline
  # alert to have fired. Frequent pings mean a single dropped ping can
  # flip the node dead for ~30s; those blips shouldn't send an all-clear.
  condition:
    - condition: template
      value_template: >
        {{ (trigger.to_state.last_changed - trigger.from_state.last_changed).total_seconds() >= 60 }}

  action:
    - service: notify.mobile_app_pixel_8_pro
      data:
        title: "✅🔌 Garage Freezer Plug Back Online"
        message: >
          The garage outdoor double plug is back online — GFCI reset
          appears to have worked. Verify the freezer is running and cold.
        data:
          channel: "Emergency Alerts"
          importance: normal
          ttl: 0
          priority: normal
          color: green

  mode: single

# ----------------------------------------------------------
# AUTOMATION 3: Garage Freezer Plug Startup Check
# ----------------------------------------------------------
- id: garage_freezer_plug_startup_check
  alias: "Safety - Garage Freezer Plug Startup Check"
  description: >
    A restart kills Automation 1's reminder loop, and its state trigger
    won't re-fire if the plug is already offline when HA comes back.
    After startup, restart the offline alert if the plug is still down.

  trigger:
    - platform: homeassistant
      event: start

  action:
    # Z-Wave JS entities read "unavailable" for a while after every
    # restart; give the integration time to reconnect to avoid a false alarm.
    - delay:
        minutes: 2

    - condition: template
      value_template: >
        {{ states('sensor.garage_outdoor_double_plug_node_status') in ['dead', 'unavailable'] }}

    - service: automation.trigger
      target:
        entity_id: automation.safety_garage_freezer_plug_offline
      data:
        skip_condition: true

  mode: single
