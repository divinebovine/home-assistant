###############################################################
# Low Battery Daily Sync
#
# Monitored devices:
#   - Every sensor with device_class: battery, discovered automatically
#   - Excluded integrations: mobile_app (phones/tablets) and Tesla
#     (car battery is not a replaceable cell)
#
# Thresholds (input_number/battery_helpers.yaml, editable from the UI):
#   - input_number.battery_low_threshold   — most devices (suggested 25%)
#   - input_number.battery_lock_threshold  — any device with a lock.*
#     entity (suggested 40%; lock batteries drop off a cliff and a dead
#     lock is the costliest failure)
#   - input_number.battery_stale_days      — no report for this long
#     means the reading can't be trusted (suggested 7)
#
# Logic (once a day at 8 AM, before the workday meetings start):
#   - Each device needing attention gets its own phone notification in
#     the "battery" group, tagged per entity. Android stacks them under
#     one expandable header, so nothing is truncated, and re-sending a
#     tag updates that entry in place instead of adding a duplicate.
#   - Stale: battery sensor unavailable, Z-Wave node dead, or no report
#     (last_reported) for battery_stale_days. Takes precedence over low,
#     since the level of a stale device is not trustworthy.
#   - Low: level below the device's threshold.
#   - Healthy devices get clear_notification for their tag, so a
#     replaced battery drops off the phone at the next sync.
#   - Z-Wave batteries silent for 3+ days get zwave_js.refresh_value.
#     Battery devices sleep, so the request is queued until the next
#     wake-up; a device that never answers ends up flagged stale.
#
# Notes:
#   - last_reported resets when HA restarts, so staleness can be
#     understated for a few days after a restart.
#   - Low notifications are sent highest level first, so the lowest
#     battery is posted last and sits at the top of the group.
###############################################################

- id: low_battery_daily_sync
  alias: "Devices - Low Battery Daily Sync"
  description: >
    Daily sync of per-device low and stale battery notifications.
    Notifies devices below threshold or not reporting, clears devices
    that are healthy again, and asks stale Z-Wave devices to re-report.

  trigger:
    - platform: time
      at: "08:00:00"

  action:
    - variables:
        excluded_integrations:
          - mobile_app
          - tesla_fleet
          - teslemetry
          - tessie
          - tesla_custom
        refresh_days: 3
        batteries: >
          {% set low_threshold = states('input_number.battery_low_threshold') | float(25) %}
          {% set lock_threshold = states('input_number.battery_lock_threshold') | float(40) %}
          {% set stale_days = states('input_number.battery_stale_days') | float(7) %}
          {% set ex = namespace(ids=[]) %}
          {% for i in excluded_integrations %}
            {% set ex.ids = ex.ids + integration_entities(i) %}
          {% endfor %}
          {% set zwave = integration_entities('zwave_js') %}
          {% set ns = namespace(items=[]) %}
          {% for s in states.sensor
               | selectattr('attributes.device_class', 'eq', 'battery')
               | rejectattr('entity_id', 'in', ex.ids) %}
            {% set dev = device_id(s.entity_id) %}
            {% set dev_entities = device_entities(dev) if dev else [] %}
            {% set threshold = lock_threshold if dev_entities | select('match', 'lock[.]') | list | count > 0 else low_threshold %}
            {% set node_status = dev_entities | select('match', 'sensor[.].*_node_status$') | map('states') | first | default('') %}
            {% set unavailable = s.state in ['unavailable', 'unknown'] or node_status == 'dead' %}
            {% set days = ((now() - s.last_reported).total_seconds() / 86400) | round(1) %}
            {% set level = s.state | int(-1) %}
            {% set status = 'stale' if unavailable or days >= stale_days
                       else 'low' if level < threshold
                       else 'ok' %}
            {% set ns.items = ns.items + [{
                 'entity_id': s.entity_id,
                 'tag': 'battery_' ~ s.object_id,
                 'name': (device_attr(dev, 'name_by_user') or device_attr(dev, 'name') or s.name) if dev else s.name,
                 'level': level,
                 'threshold': threshold | int,
                 'days': days,
                 'unavailable': unavailable,
                 'status': status,
                 'refresh': s.entity_id in zwave and not unavailable and days >= refresh_days
               }] %}
          {% endfor %}
          {{ ns.items }}

    # Clear first so a device that recovered disappears before the
    # current alerts are posted
    - repeat:
        for_each: "{{ batteries | selectattr('status', 'eq', 'ok') | map(attribute='tag') | list }}"
        sequence:
          - service: notify.mobile_app_pixel_8_pro
            data:
              message: clear_notification
              data:
                tag: "{{ repeat.item }}"

    - repeat:
        for_each: "{{ batteries | selectattr('status', 'eq', 'stale') | list }}"
        sequence:
          - service: notify.mobile_app_pixel_8_pro
            data:
              title: "⚠️ {{ repeat.item.name }} not reporting"
              message: >
                {% if repeat.item.unavailable -%}
                Device is unavailable. Check the battery or Z-Wave connection.
                {%- else -%}
                Last report {{ repeat.item.days | int }} days ago (showed {{ repeat.item.level }}%).
                {%- endif %}
              data:
                tag: "{{ repeat.item.tag }}"
                group: battery
                channel: "Device Alerts"
                alert_once: true
                ttl: 0
                priority: high

    - repeat:
        for_each: "{{ batteries | selectattr('status', 'eq', 'low') | sort(attribute='level', reverse=true) | list }}"
        sequence:
          - service: notify.mobile_app_pixel_8_pro
            data:
              title: "🔋 {{ repeat.item.name }}: {{ repeat.item.level }}%"
              message: >
                Below {{ repeat.item.threshold }}%. Last reported
                {{ 'today' if repeat.item.days < 1 else (repeat.item.days | int) ~ ' day(s) ago' }}.
              data:
                tag: "{{ repeat.item.tag }}"
                group: battery
                channel: "Device Alerts"
                alert_once: true
                ttl: 0
                priority: high

    - variables:
        to_refresh: "{{ batteries | selectattr('refresh') | map(attribute='entity_id') | list }}"
    - if:
        - condition: template
          value_template: "{{ to_refresh | count > 0 }}"
      then:
        - service: zwave_js.refresh_value
          target:
            entity_id: "{{ to_refresh }}"
          continue_on_error: true

  mode: single
